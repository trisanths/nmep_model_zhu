AUG:
  COLOR_JITTER: 0.4
DATA:
  BATCH_SIZE: 256
  NUM_WORKERS: 16
  DATASET: "cifar10"
  IMG_SIZE: 32
MODEL:
  NAME: resnet18
  NUM_CLASSES: 10
  DROP_RATE: 0.9
TRAIN:
  EPOCHS: 30
  WARMUP_EPOCHS: 20
  LR: 1e-3
  WEIGHT_DECAY: 0.05
  MIN_LR: 2e-2
  WARMUP_LR: 2e-2
  LR_SCHEDULER:
    NAME: "cosine"
  OPTIMIZER:
    NAME: "adamw"
    EPS: 1e-8
    BETAS: (0.9, 0.999)
    MOMENTUM: 0.9
OUTPUT: "output/resnet18_cifar"
SAVE_FREQ: 50 
PRINT_FREQ: 500
